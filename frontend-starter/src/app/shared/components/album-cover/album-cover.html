<a class="album" [routerLink]="['/albums', album().id]" [style.--album-color]="color()">
  <div class="cover">
    <span class="spine" aria-hidden="true"></span>
    @if (logo(); as logo) {
      <img class="emblem-logo" [src]="logo" alt="" loading="lazy" />
    } @else {
      <mat-icon class="emblem-icon" aria-hidden="true">{{ icon() }}</mat-icon>
    }
    <span
      class="visibility"
      [matTooltip]="album().visibility === 'public' ? 'Public : visible par tous' : 'Privé : visible par toi seul'"
    >
      <mat-icon aria-hidden="true">{{ album().visibility === 'public' ? 'public' : 'lock' }}</mat-icon>
      <span class="sr-only">{{ album().visibility === 'public' ? 'Album public' : 'Album privé' }}</span>
    </span>
  </div>
  <div class="info">
    <h3>{{ album().title }}</h3>
    <p class="count">{{ cardLabel() }}</p>
    <app-theme-chips [theme]="album().theme" />
  </div>
</a>

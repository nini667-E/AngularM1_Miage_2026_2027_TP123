<a class="album" [routerLink]="['/albums', album().id]" [style.--album-color]="color()">
  <div class="cover">
    <span class="spine" aria-hidden="true"></span>
    @if (logo(); as logo) {
      <img class="emblem-logo" [src]="logo" alt="" loading="lazy" />
    } @else {
      <mat-icon class="emblem-icon" aria-hidden="true">{{ icon() }}</mat-icon>
    }
    <span class="visibility" [matTooltip]="visibility().tooltip">
      <mat-icon aria-hidden="true">{{ visibility().icon }}</mat-icon>
      <span class="sr-only">{{ visibility().label }}</span>
    </span>
  </div>
  <div class="info">
    <h3>{{ album().title }}</h3>
    @if (owner(); as owner) {
      <p class="owner">par {{ owner.name }}</p>
    }
    <p class="count">{{ cardLabel() }}</p>
    <app-theme-chips [theme]="album().theme" />
  </div>
</a>

<mat-card appearance="outlined" class="auth-card">
  <mat-card-header>
    <mat-card-title class="cv-gold-text">Connexion</mat-card-title>
    <mat-card-subtitle>Retrouve ta collection</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.errors?.['required']) {
          <mat-error>Email requis</mat-error>
        } @else if (form.controls.email.errors?.['email']) {
          <mat-error>Format d'email invalide</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error>Mot de passe requis</mat-error>
      </mat-form-field>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button mat-flat-button type="submit" [disabled]="form.invalid">Se connecter</button>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button routerLink="/register">Créer un compte</a>
  </mat-card-actions>
</mat-card>

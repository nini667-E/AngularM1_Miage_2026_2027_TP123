<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom
      <input formControlName="name" />
      @if (form.controls.name.invalid && (form.controls.name.touched || form.controls.name.dirty)) {
        <span class="error">Nom requis</span>
      }
    </label>
    <label>
      Email
      <input type="email" formControlName="email" />
      @if (form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)) {
        <span class="error">
          @if (form.controls.email.errors?.['required']) {
            Email requis
          } @else if (form.controls.email.errors?.['email']) {
            Format d'email invalide
          }
        </span>
      }
    </label>
    <label>
      Mot de passe
      <input type="password" formControlName="password" />
      @if (form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)) {
        <span class="error">
          @if (form.controls.password.errors?.['required']) {
            Mot de passe requis
          } @else if (form.controls.password.errors?.['minlength']) {
            8 caractères minimum
          }
        </span>
      }
    </label>
    <button type="submit" [disabled]="form.invalid">Créer mon compte</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/login">Déjà inscrit ?</a></p>
</section>

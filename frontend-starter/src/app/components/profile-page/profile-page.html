<section class="cv-page">
  <h1 class="cv-page-title">Mon profil</h1>
  @if (auth.currentUser(); as user) {
    <mat-card appearance="outlined" class="profile-card">
      <mat-card-header>
        <div mat-card-avatar class="avatar" aria-hidden="true">{{ user.name.charAt(0).toUpperCase() }}</div>
        <mat-card-title>{{ user.name }}</mat-card-title>
        <mat-card-subtitle>{{ user.email }} · membre depuis le {{ user.createdAt | date: 'dd/MM/yyyy' }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="save()">
          <mat-form-field appearance="outline">
            <mat-label>Pseudo</mat-label>
            <input matInput formControlName="name" />
            <mat-error>Pseudo requis</mat-error>
          </mat-form-field>
          <button mat-flat-button type="submit" [disabled]="form.invalid">Enregistrer</button>
        </form>
      </mat-card-content>
    </mat-card>
  }
</section>

@if (page(); as page) {
  <section class="cv-page">
    <h1 class="cv-page-title">{{ page.title }}</h1>
    <mat-card appearance="outlined" class="placeholder">
      <mat-card-content>
        <mat-icon class="icon" aria-hidden="true">{{ page.icon }}</mat-icon>
        <p>{{ page.description }}</p>
        <p class="step">Disponible à l'étape {{ page.step }} du projet.</p>
      </mat-card-content>
    </mat-card>
  </section>
}
